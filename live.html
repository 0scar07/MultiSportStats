<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partidos · MultiSport Stats</title>
  <meta name="description" content="Partidos en vivo, próximos y resultados de La Liga, Premier League, NBA, Roland Garros, NHL y Fórmula 1.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="js/core/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/pages/live.js"></script>
</head>
<body data-page="live">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <main id="main" class="main">
    <header class="page-header">
      <div>
        <h1>Partidos</h1>
        <p>En vivo, próximos y resultados de todas las ligas.</p>
      </div>
      <div class="page-header__actions">
        <span class="data-note" id="updated"></span>
        <button type="button" class="btn" id="refreshBtn">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#refresh"></use></svg> Actualizar
        </button>
      </div>
    </header>

    <div class="toolbar">
      <div class="chips" id="sportChips" role="group" aria-label="Filtrar por deporte"></div>
    </div>
    <div class="toolbar">
      <div class="chips" id="statusChips" role="group" aria-label="Filtrar por estado"></div>
      <label class="search">
        <span class="sr-only">Buscar equipo, jugador o liga</span>
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg>
        <input type="search" id="q" placeholder="Buscar equipo, jugador o liga…" autocomplete="off">
      </label>
    </div>

    <p class="sr-only" id="resultCount" aria-live="polite"></p>
    <div id="list"></div>
  </main>

  <noscript><p class="notice" style="margin:1rem">MultiSport Stats necesita JavaScript para cargar los datos.</p></noscript>
</body>
</html>
