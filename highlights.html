<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resúmenes · MultiSport Stats</title>
  <meta name="description" content="Resultados recientes con enlace directo a sus resúmenes en vídeo.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="js/core/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/highlights.css">
  <script type="module" src="js/pages/highlights.js"></script>
</head>
<body data-page="highlights">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <main id="main" class="main">
    <header class="page-header">
      <div>
        <h1>Resúmenes</h1>
        <p>Partidos terminados. Cada tarjeta abre la búsqueda de su resumen en YouTube.</p>
      </div>
    </header>

    <div class="toolbar">
      <div class="chips" id="sportChips" role="group" aria-label="Filtrar por deporte"></div>
      <label class="search">
        <span class="sr-only">Buscar por equipo o competición</span>
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg>
        <input type="search" id="q" placeholder="Buscar por equipo o competición…" autocomplete="off">
      </label>
    </div>

    <p class="sr-only" id="resultCount" aria-live="polite"></p>
    <div id="list"></div>
  </main>

  <noscript><p class="notice" style="margin:1rem">MultiSport Stats necesita JavaScript para cargar los datos.</p></noscript>
</body>
</html>
