<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MultiSport Stats — Live Matches</title>
  <link rel="stylesheet" href="live.css">
  <style>
    * { box-sizing: border-box; }

    /* ── TOPBAR DEPORTES ── */
    .sports-topbar {
      background: white;
      border-bottom: 2px solid #f0f2f5;
      display: flex; align-items: center; gap: 0;
      overflow-x: auto; white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      margin-bottom: 0;
      padding: 0 8px;
    }
    .sport-tab {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 13px 18px; font-size: 13px; font-weight: 700;
      color: #8a9ab0; cursor: pointer; transition: all .2s;
      border-bottom: 3px solid transparent;
      white-space: nowrap; text-decoration: none;
      margin-bottom: -2px;
    }
    .sport-tab:hover { color: #1a2535; border-bottom-color: #e2e8f0; }
    .sport-tab.active { color: #e53935; border-bottom-color: #e53935; }

    /* ── LAYOUT CON SIDEBAR LIGAS ── */
    .fs-layout {
      display: flex; gap: 14px;
      padding: 14px 0 0 0;
      align-items: flex-start;
    }

    /* ── SIDEBAR LIGAS ── */
    .fs-leagues-sidebar {
      width: 200px; flex-shrink: 0;
      position: sticky; top: 56px;
    }
    .fs-leagues-box {
      background: white; border-radius: 8px;
      border: 1px solid #e2e8f0; overflow: hidden;
    }
    .fs-leagues-title {
      padding: 10px 12px; font-size: 10px; font-weight: 800;
      color: #8a9ab0; text-transform: uppercase; letter-spacing: 1px;
      border-bottom: 1px solid #f0f2f5;
      display: flex; align-items: center; gap: 6px;
    }
    .fs-league-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; font-size: 12px; font-weight: 600;
      color: #1a2535; cursor: pointer;
      border-bottom: 1px solid #f8faf9;
      transition: background .15s;
    }
    .fs-league-item:last-child { border-bottom: none; }
    .fs-league-item:hover { background: #f0fdf4; color: #166534; }
    .fs-league-item img { width: 16px; height: 16px; object-fit: contain; flex-shrink: 0; }
    .fs-league-count {
      margin-left: auto; font-size: 10px; font-weight: 800;
      color: #e53935; background: rgba(229,57,53,0.08);
      padding: 1px 6px; border-radius: 10px;
    }

    /* ── CONTENIDO ── */
    .fs-content { flex: 1; min-width: 0; }

    /* ── BARRA LIVE ── */
    .fs-live-bar {
      display: flex; align-items: center; gap: 8px;
      background: #0f1923; color: white;
      padding: 8px 14px; border-radius: 8px;
      margin-bottom: 10px; font-size: 12px; font-weight: 600;
    }
    .pulse-ring {
      position: relative; width: 12px; height: 12px; flex-shrink: 0;
    }
    .pulse-ring::before {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: #22c55e; animation: ringPulse 1.5s infinite;
    }
    .pulse-ring::after {
      content: ''; position: absolute; inset: 3px;
      border-radius: 50%; background: #22c55e;
    }
    @keyframes ringPulse {
      0%{transform:scale(1);opacity:1} 100%{transform:scale(2.2);opacity:0}
    }
    .fs-updated { margin-left: auto; color: #8a9ab0; font-size: 11px; font-weight: 400; }

    /* ── FILTROS ── */
    .fs-filters {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 12px; flex-wrap: wrap;
    }
    .fs-btn {
      padding: 6px 14px; border-radius: 4px;
      font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all .15s;
      border: 1.5px solid #e2e8f0;
      background: white; color: #8a9ab0;
      font-family: 'Barlow', sans-serif;
    }
    .fs-btn:hover { border-color: #1a2535; color: #1a2535; }
    .fs-btn.active { background: #e53935; border-color: #e53935; color: white; }
    .fs-btn-count {
      display: inline-block;
      background: rgba(0,0,0,0.08); color: inherit;
      font-size: 10px; font-weight: 800;
      padding: 1px 5px; border-radius: 8px; margin-left: 4px;
    }
    .fs-btn.active .fs-btn-count { background: rgba(255,255,255,0.25); }

    /* ── GRUPO LIGA ── */
    .fs-group { background: white; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 8px; overflow: hidden; }

    .fs-group-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; background: #f8faf9;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer; transition: background .15s;
    }
    .fs-group-header:hover { background: #f0f4f8; }
    .fs-group-header img { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
    .fs-group-country { font-size: 11px; font-weight: 800; color: #8a9ab0; text-transform: uppercase; letter-spacing: 0.5px; }
    .fs-group-name { font-size: 12px; font-weight: 800; color: #1a2535; flex: 1; }
    .fs-group-live { font-size: 11px; font-weight: 700; color: #e53935; }
    .fs-group-toggle { font-size: 10px; color: #8a9ab0; transition: transform .2s; }
    .fs-group.collapsed .fs-group-toggle { transform: rotate(-90deg); }
    .fs-group.collapsed .fs-group-body { display: none; }
    .fs-standings-btn {
      font-size: 10px; font-weight: 700; color: #22c55e;
      text-decoration: none; opacity: 0; transition: opacity .15s;
      margin-right: 4px;
    }
    .fs-group-header:hover .fs-standings-btn { opacity: 1; }

    /* ── FILA PARTIDO ── */
    .fs-row {
      display: flex; align-items: center;
      padding: 0 14px; min-height: 50px;
      border-bottom: 1px solid #f4f6f8;
      transition: background .1s;
    }
    .fs-row:last-child { border-bottom: none; }
    .fs-row:hover { background: #fafbfc; }

    .fs-row-status {
      width: 52px; flex-shrink: 0; text-align: center;
    }
    .fs-live-min {
      font-size: 12px; font-weight: 800; color: #e53935;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .fs-blink {
      width: 5px; height: 5px; border-radius: 50%;
      background: #e53935; animation: blink 1s infinite;
      display: block; margin: 0 auto;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
    .fs-fin { font-size: 11px; font-weight: 700; color: #8a9ab0; }
    .fs-ht { font-size: 11px; font-weight: 800; color: #f59e0b; }
    .fs-upcoming-time { font-size: 12px; font-weight: 700; color: #1a2535; }

    .fs-row-teams { flex: 1; padding: 6px 10px; min-width: 0; }
    .fs-team {
      display: flex; align-items: center; gap: 7px;
      padding: 2px 0;
    }
    .fs-team img { width: 17px; height: 17px; object-fit: contain; flex-shrink: 0; }
    .fs-team-name {
      font-size: 13px; font-weight: 600; color: #1a2535;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .fs-team-name.bold { font-weight: 800; color: #0a0f1a; }

    .fs-row-scores {
      width: 24px; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .fs-score-val {
      font-size: 14px; font-weight: 800; color: #1a2535; line-height: 1;
    }
    .fs-score-val.red { color: #e53935; }
    .fs-score-val.bold { color: #0a0f1a; }

    @keyframes scoreFlash {
      0% { background: #fef08a; transform: scale(1.35); border-radius: 4px; }
      100% { background: transparent; transform: scale(1); }
    }
    .score-flash { animation: scoreFlash 0.7s ease-out; }

    /* ── EMPTY / LOADING ── */
    .fs-empty {
      text-align: center; padding: 48px 20px;
      background: white; border-radius: 8px; border: 1px solid #e2e8f0;
      color: #8a9ab0;
    }
    .fs-loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 60px 20px; gap: 14px;
      background: white; border-radius: 8px; border: 1px solid #e2e8f0;
    }
    .fs-spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #e2e8f0; border-top-color: #e53935;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TOAST ── */
    .goal-toast {
      position: fixed; top: 20px; right: 24px;
      background: linear-gradient(135deg, #166534, #22c55e);
      color: white; padding: 12px 18px; border-radius: 12px;
      font-weight: 700; font-size: 13px;
      box-shadow: 0 8px 30px rgba(34,197,94,0.4);
      z-index: 9999; transform: translateX(200%);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      min-width: 220px;
    }
    .goal-toast.show { transform: translateX(0); }
    .toast-title { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; opacity: 0.8; margin-bottom: 3px; }
    .toast-body { font-size: 14px; font-weight: 800; }
    .toast-sub { font-size: 11px; opacity: 0.8; margin-top: 2px; }

    /* ── ERROR ── */
    .fs-error {
      background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px; padding: 16px 20px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 12px;
    }
    .fs-error-text .t { font-weight: 700; font-size: 13px; color: #dc2626; }
    .fs-error-text .s { font-size: 11px; color: #8a9ab0; margin-top: 2px; }
    .fs-retry {
      margin-left: auto; background: #dc2626; color: white;
      border: none; border-radius: 6px; padding: 7px 14px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      font-family: 'Barlow', sans-serif;
    }
    .fs-retry:hover { background: #ef4444; }
  </style>
</head>
<body class="app-body">

  <div class="goal-toast" id="goalToast">
    <div class="toast-title" id="toastTitle">⚽ GOLAZO</div>
    <div class="toast-body" id="toastBody"></div>
    <div class="toast-sub" id="toastSub"></div>
  </div>

  <!-- SIDEBAR PRINCIPAL -->
  <aside class="sidebar">
    <a class="sidebar-logo" href="index.html">
      <div class="sidebar-logo-icon">🏆</div>
      <div class="sidebar-logo-text">Multi<span>Sport</span><br>Stats</div>
    </a>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html"><span class="nav-icon">🏠</span> Dashboard</a>
      <a class="nav-item active" href="live.html"><span class="nav-icon">📊</span> Live Matches</a>
      <a class="nav-item" href="standings.html"><span class="nav-icon">🏅</span> Standings</a>
      <a class="nav-item" href="profile.html"><span class="nav-icon">👤</span> Mi Perfil</a>
      <a class="nav-item" href="about.html"><span class="nav-icon">ℹ️</span> About Us</a>
    </nav>
    <div class="sidebar-footer">
      <a class="logout-btn" href="login.html"><span>↩</span> Logout</a>
    </div>
  </aside>

  <main class="main" style="padding-top:0;padding-left:0;padding-right:0;">

    <!-- TOPBAR DEPORTES (estilo Flashscore) -->
    <div class="sports-topbar">
      <div class="sport-tab active" onclick="setSport('futbol',this)">⚽ Fútbol</div>
      <div class="sport-tab" onclick="setSport('baloncesto',this)">🏀 Baloncesto</div>
      <div class="sport-tab" onclick="setSport('hockey',this)">🏒 Hockey</div>
      <div class="sport-tab" onclick="setSport('all',this)">🎯 Todos</div>
    </div>

    <div style="padding:0 20px 20px;">

      <div class="fs-error" id="errorBox" style="display:none;margin-top:14px;">
        <div>⚠️</div>
        <div class="fs-error-text">
          <div class="t">Error al conectar con la API</div>
          <div class="s" id="errorMsg">Verifica tu conexión.</div>
        </div>
        <button class="fs-retry" onclick="fetchAll()">↺ Reintentar</button>
      </div>

      <div class="fs-layout">

        <!-- SIDEBAR LIGAS -->
        <div class="fs-leagues-sidebar">
          <div class="fs-leagues-box">
            <div class="fs-leagues-title">📌 Ligas activas</div>
            <div id="leaguesSidebar">
              <div style="padding:12px;font-size:12px;color:#8a9ab0;text-align:center">Cargando...</div>
            </div>
          </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="fs-content">

          <!-- BARRA LIVE -->
          <div class="fs-live-bar" style="margin-top:14px;">
            <div class="pulse-ring"></div>
            <span id="liveCount">Cargando partidos...</span>
            <span class="fs-updated" id="lastUpdated">Conectando...</span>
          </div>

          <!-- FILTROS -->
          <div class="fs-filters">
            <button class="fs-btn active" onclick="setFilter('live',this)">
              🔴 En directo <span class="fs-btn-count" id="cnt-live">0</span>
            </button>
            <button class="fs-btn" onclick="setFilter('finished',this)">
              ⚫ Finalizados <span class="fs-btn-count" id="cnt-finished">0</span>
            </button>
            <button class="fs-btn" onclick="setFilter('upcoming',this)">
              🕐 Próximos <span class="fs-btn-count" id="cnt-upcoming">0</span>
            </button>
            <button class="fs-btn" onclick="setFilter('all',this)">
              Todos <span class="fs-btn-count" id="cnt-all">0</span>
            </button>
          </div>

          <!-- LISTA -->
          <div id="matchesContainer">
            <div class="fs-loading">
              <div class="fs-spinner"></div>
              <div style="font-size:13px;color:#8a9ab0;font-weight:600">Obteniendo partidos en vivo...</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script>
    const API_KEY = 'de9172e8894f793288ab4b3778e6a695';
    const PROXY   = 'https://corsproxy.io/?';

    let allMatches   = [];
    let activeSport  = 'futbol';
    let activeFilter = 'live';
    let collapsed    = new Set();

    // ── FETCH ──
    async function fetchFootball() {
      const url = PROXY + encodeURIComponent('https://v3.football.api-sports.io/fixtures?live=all');
      const res = await fetch(url, { headers: { 'x-apisports-key': API_KEY } });
      const data = await res.json();
      if (!data.response) return [];
      return data.response.map(f => ({
        id: 'fb_' + f.fixture.id, sport: 'futbol',
        leagueId: f.league.id, league: f.league.name,
        leagueLogo: f.league.logo, leagueCountry: f.league.country,
        t1: f.teams.home.name,     t2: f.teams.away.name,
        logo1: f.teams.home.logo,  logo2: f.teams.away.logo,
        s1: f.goals.home ?? 0,     s2: f.goals.away ?? 0,
        elapsed: f.fixture.status.elapsed,
        statusShort: f.fixture.status.short,
        state: ['1H','2H','ET','P'].includes(f.fixture.status.short) ? 'live'
             : f.fixture.status.short === 'HT' ? 'live'
             : ['FT','AET','PEN'].includes(f.fixture.status.short) ? 'finished'
             : 'upcoming'
      }));
    }

    async function fetchBasketball() {
      const today = new Date().toISOString().split('T')[0];
      const url = PROXY + encodeURIComponent(`https://v2.nba.api-sports.io/games?date=${today}`);
      const res = await fetch(url, { headers: { 'x-apisports-key': API_KEY } });
      const data = await res.json();
      if (!data.response) return [];
      return data.response.map(g => ({
        id: 'nba_' + g.id, sport: 'baloncesto',
        leagueId: 'nba', league: 'NBA', leagueLogo: '', leagueCountry: 'USA',
        t1: g.teams.home.name,       t2: g.teams.visitors.name,
        logo1: g.teams.home.logo,    logo2: g.teams.visitors.logo,
        s1: g.scores.home.points ?? 0, s2: g.scores.visitors.points ?? 0,
        elapsed: g.periods.current ? `Q${g.periods.current}` : null,
        statusShort: String(g.status.short),
        state: g.status.short === 2 ? 'live' : g.status.short === 3 ? 'finished' : 'upcoming'
      }));
    }

    async function fetchHockey() {
      const today = new Date().toISOString().split('T')[0];
      const url = PROXY + encodeURIComponent(`https://v1.hockey.api-sports.io/games?date=${today}`);
      const res = await fetch(url, { headers: { 'x-apisports-key': API_KEY } });
      const data = await res.json();
      if (!data.response) return [];
      return data.response.map(g => ({
        id: 'hk_' + g.id, sport: 'hockey',
        leagueId: 'hk_' + g.league.id, league: g.league.name,
        leagueLogo: g.league.logo, leagueCountry: g.league.country,
        t1: g.teams.home.name,   t2: g.teams.away.name,
        logo1: g.teams.home.logo, logo2: g.teams.away.logo,
        s1: g.scores.home ?? 0,  s2: g.scores.away ?? 0,
        elapsed: g.periods.current ? `P${g.periods.current}` : null,
        statusShort: g.status.short,
        state: g.status.short === '2' ? 'live' : g.status.short === '3' ? 'finished' : 'upcoming'
      }));
    }

    async function fetchAll() {
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('matchesContainer').innerHTML = `
        <div class="fs-loading">
          <div class="fs-spinner"></div>
          <div style="font-size:13px;color:#8a9ab0;font-weight:600">Obteniendo partidos en vivo...</div>
        </div>`;

      try {
        const [fb, bk, hk] = await Promise.allSettled([
          fetchFootball(), fetchBasketball(), fetchHockey()
        ]);
        allMatches = [
          ...(fb.status === 'fulfilled' ? fb.value : []),
          ...(bk.status === 'fulfilled' ? bk.value : []),
          ...(hk.status === 'fulfilled' ? hk.value : []),
        ];
        updateAll();
      } catch(e) {
        document.getElementById('errorBox').style.display = 'flex';
        document.getElementById('errorMsg').textContent = e.message;
        document.getElementById('matchesContainer').innerHTML = '';
      }
    }

    function updateAll() {
      updateCounts();
      updateSidebar();
      render();
      const live = allMatches.filter(m => m.state === 'live').length;
      const now  = new Date().toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
      document.getElementById('liveCount').textContent = live > 0
        ? `${live} partido${live !== 1 ? 's' : ''} en directo ahora mismo`
        : 'No hay partidos en directo ahora mismo';
      document.getElementById('lastUpdated').textContent = `Actualizado ${now} ✓`;
    }

    function getSported() {
      return activeSport === 'all' ? allMatches : allMatches.filter(m => m.sport === activeSport);
    }

    function updateCounts() {
      const s = getSported();
      document.getElementById('cnt-live').textContent     = s.filter(m => m.state === 'live').length;
      document.getElementById('cnt-finished').textContent = s.filter(m => m.state === 'finished').length;
      document.getElementById('cnt-upcoming').textContent = s.filter(m => m.state === 'upcoming').length;
      document.getElementById('cnt-all').textContent      = s.length;
    }

    function updateSidebar() {
      const sport = getSported();
      const leagues = {};
      sport.forEach(m => {
        if (!leagues[m.leagueId]) leagues[m.leagueId] = { name: m.league, logo: m.leagueLogo, live: 0, total: 0 };
        leagues[m.leagueId].total++;
        if (m.state === 'live') leagues[m.leagueId].live++;
      });

      const sorted = Object.entries(leagues).sort((a,b) => b[1].live - a[1].live || b[1].total - a[1].total);
      const el = document.getElementById('leaguesSidebar');

      if (!sorted.length) {
        el.innerHTML = `<div style="padding:12px;font-size:12px;color:#8a9ab0;text-align:center">Sin partidos</div>`;
        return;
      }
      el.innerHTML = sorted.map(([id, lg]) => `
        <div class="fs-league-item" onclick="scrollTo('grp-${id}')">
          ${lg.logo ? `<img src="${lg.logo}" onerror="this.style.display='none'"/>` : '<span>🏆</span>'}
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${lg.name}</span>
          ${lg.live > 0 ? `<span class="fs-league-count">${lg.live}</span>` : ''}
        </div>`).join('');
    }

    function scrollTo(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
    }

    // ── RENDER PRINCIPAL ──
    function render() {
      const container = document.getElementById('matchesContainer');
      let list = getSported();
      if (activeFilter !== 'all') list = list.filter(m => m.state === activeFilter);

      if (!list.length) {
        const labels = { live:'en directo', finished:'finalizados', upcoming:'próximos', all:'disponibles' };
        container.innerHTML = `
          <div class="fs-empty">
            <div style="font-size:40px;margin-bottom:10px">🎯</div>
            <div style="font-size:15px;font-weight:700;color:#1a2535;margin-bottom:4px">No hay partidos ${labels[activeFilter]}</div>
            <div style="font-size:12px">Los fines de semana hay más actividad deportiva.</div>
          </div>`;
        return;
      }

      // Agrupar por liga
      const groups = {};
      list.forEach(m => {
        if (!groups[m.leagueId]) groups[m.leagueId] = {
          id: m.leagueId, name: m.league,
          logo: m.leagueLogo, country: m.leagueCountry,
          matches: [], liveCount: 0
        };
        groups[m.leagueId].matches.push(m);
        if (m.state === 'live') groups[m.leagueId].liveCount++;
      });

      const sorted = Object.values(groups).sort((a,b) => b.liveCount - a.liveCount || b.matches.length - a.matches.length);

      container.innerHTML = sorted.map(g => {
        const isCollapsed = collapsed.has(g.id);
        const countryStr = g.country && g.country !== 'World' ? g.country.toUpperCase() + ': ' : '';
        return `
          <div class="fs-group ${isCollapsed ? 'collapsed' : ''}" id="grp-${g.id}">
            <div class="fs-group-header" onclick="toggleGroup('${g.id}')">
              ${g.logo ? `<img src="${g.logo}" onerror="this.style.display='none'" alt=""/>` : '<span>🏆</span>'}
              <span class="fs-group-country">${countryStr}</span>
              <span class="fs-group-name">${g.name}</span>
              ${g.liveCount > 0 ? `<span class="fs-group-live">● ${g.liveCount} en vivo</span>` : `<span style="font-size:11px;color:#8a9ab0">${g.matches.length} partidos</span>`}
              <a class="fs-standings-btn" href="standings.html">Clasificación ↗</a>
              <span class="fs-group-toggle">▼</span>
            </div>
            <div class="fs-group-body">
              ${g.matches.map(m => renderRow(m)).join('')}
            </div>
          </div>`;
      }).join('');
    }

    function renderRow(m) {
      const live     = m.state === 'live';
      const finished = m.state === 'finished';
      const w1 = finished && m.s1 > m.s2;
      const w2 = finished && m.s2 > m.s1;
      const isHT = m.statusShort === 'HT';

      let statusHtml;
      if (live && isHT) {
        statusHtml = `<div class="fs-ht">HT</div>`;
      } else if (live) {
        const min = typeof m.elapsed === 'number' ? m.elapsed + "'" : (m.elapsed || 'LIVE');
        statusHtml = `<div class="fs-live-min"><span class="fs-blink"></span><span>${min}</span></div>`;
      } else if (finished) {
        statusHtml = `<div class="fs-fin">Final</div>`;
      } else {
        statusHtml = `<div class="fs-upcoming-time">–</div>`;
      }

      const showScore = live || finished;

      return `
        <div class="fs-row" id="${m.id}">
          <div class="fs-row-status">${statusHtml}</div>
          <div class="fs-row-teams">
            <div class="fs-team">
              <img src="${m.logo1||''}" onerror="this.style.display='none'" alt=""/>
              <span class="fs-team-name ${w1 ? 'bold' : ''}">${m.t1}</span>
            </div>
            <div class="fs-team">
              <img src="${m.logo2||''}" onerror="this.style.display='none'" alt=""/>
              <span class="fs-team-name ${w2 ? 'bold' : ''}">${m.t2}</span>
            </div>
          </div>
          <div class="fs-row-scores">
            <span class="fs-score-val ${live ? 'red' : ''} ${w1 ? 'bold' : ''}" id="${m.id}-s1">${showScore ? m.s1 : ''}</span>
            <span class="fs-score-val ${live ? 'red' : ''} ${w2 ? 'bold' : ''}" id="${m.id}-s2">${showScore ? m.s2 : ''}</span>
          </div>
        </div>`;
    }

    function toggleGroup(id) {
      collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
      const el = document.getElementById('grp-' + id);
      if (el) el.classList.toggle('collapsed', collapsed.has(id));
    }

    function setFilter(f, el) {
      activeFilter = f;
      document.querySelectorAll('.fs-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function setSport(s, el) {
      activeSport = s;
      document.querySelectorAll('.sport-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      updateCounts(); updateSidebar(); render();
    }

    function flashScore(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('score-flash');
      void el.offsetWidth;
      el.classList.add('score-flash');
    }

    function showToast(title, body, sub) {
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastBody').textContent = body;
      document.getElementById('toastSub').textContent = sub;
      const t = document.getElementById('goalToast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3800);
    }

    async function refresh() {
      try {
        const [fb, bk, hk] = await Promise.allSettled([
          fetchFootball(), fetchBasketball(), fetchHockey()
        ]);
        const fresh = [
          ...(fb.status === 'fulfilled' ? fb.value : []),
          ...(bk.status === 'fulfilled' ? bk.value : []),
          ...(hk.status === 'fulfilled' ? hk.value : []),
        ];
        fresh.forEach(nm => {
          const old = allMatches.find(m => m.id === nm.id);
          if (old && nm.state === 'live') {
            const icons = { futbol:'⚽ GOLAZO', baloncesto:'🏀 CANASTA', hockey:'🏒 GOL' };
            if (nm.s1 > old.s1) { flashScore(nm.id+'-s1'); showToast(icons[nm.sport]||'🎯', `${nm.t1} anota!`, nm.league); }
            if (nm.s2 > old.s2) { flashScore(nm.id+'-s2'); showToast(icons[nm.sport]||'🎯', `${nm.t2} anota!`, nm.league); }
          }
        });
        allMatches = fresh;
        updateAll();
      } catch(e) { console.warn('Refresh error:', e); }
    }

    fetchAll();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
