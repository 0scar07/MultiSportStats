<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar · MultiSport Stats</title>
  <meta name="description" content="Busca equipos, pilotos, jugadores, partidos y noticias.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="js/core/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/search.css">
  <script type="module" src="js/pages/search.js"></script>
</head>
<body data-page="search">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <main id="main" class="main">
    <header class="page-header">
      <div>
        <h1>Buscar</h1>
        <p>Equipos, pilotos, tenistas, partidos y noticias.</p>
      </div>
    </header>

    <form class="search search--big" role="search" id="searchForm">
      <label for="q" class="sr-only">Buscar en MultiSport Stats</label>
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg>
      <input type="search" id="q" name="q" placeholder="Ej.: Barcelona, Lakers, Verstappen…" autocomplete="off" autofocus>
    </form>

    <div class="toolbar">
      <div class="chips" id="typeChips" role="group" aria-label="Tipo de resultado"></div>
    </div>
    <div id="suggestions" class="suggestions"></div>

    <p class="sr-only" id="resultCount" aria-live="polite"></p>
    <div id="results"></div>
  </main>

  <noscript><p class="notice" style="margin:1rem">MultiSport Stats necesita JavaScript para cargar los datos.</p></noscript>
</body>
</html>
