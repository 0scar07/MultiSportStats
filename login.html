<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · MultiSport Stats</title>
  <meta name="description" content="Inicia sesión con tu cuenta demo local de MultiSport Stats.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="js/core/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
  <script type="module" src="js/pages/auth-page.js"></script>
</head>
<body class="auth-body" data-auth="login">
  <main class="auth" id="main">
    <div class="auth__top">
      <a class="brand" href="dashboard.html" aria-label="MultiSport Stats, ir al inicio">
        <span class="brand__mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 7.5 8.5l3.5 6 3.5-7 3.5 9.5"/></svg></span>
        <span>Multi<span>Sport</span> Stats</span>
      </a>
      <button type="button" class="btn btn--icon btn--ghost" data-action="theme" aria-label="Cambiar tema"></button>
    </div>

    <section class="card auth-card" aria-labelledby="authTitle">
      <h1 id="authTitle">Iniciar sesión</h1>
      <p>Personaliza tu nombre y avatar. Tus favoritos funcionan también sin cuenta.</p>

      <div class="notice" role="note">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#alert"></use></svg>
        <span><strong>Cuenta de demostración.</strong> Solo existe en este navegador y no hay servidor.
          No uses una contraseña que utilices en otros sitios.</span>
      </div>

      <form id="authForm" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input class="input" type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error">
          <span class="field__error" id="email-error"></span>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-group">
            <input class="input" type="password" id="password" name="password" autocomplete="current-password" required aria-describedby="password-error">
            <button type="button" class="btn btn--icon btn--ghost" data-toggle="password" aria-pressed="false" aria-label="Mostrar contraseña">
              <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#eye"></use></svg>
            </button>
          </div>
          <span class="field__error" id="password-error"></span>
        </div>
        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn--primary btn--block">Entrar</button>
      </form>

      <p class="auth-footer">¿No tienes cuenta demo? <a href="register.html">Crea una</a></p>
      <p class="auth-footer"><a href="dashboard.html">Seguir sin cuenta</a></p>
    </section>
  </main>
</body>
</html>
