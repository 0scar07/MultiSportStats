<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablas · MultiSport Stats</title>
  <meta name="description" content="Clasificaciones de La Liga, Premier League, NBA, NHL y Fórmula 1, y cuadro de Roland Garros.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="js/core/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/standings.css">
  <script type="module" src="js/pages/standings.js"></script>
</head>
<body data-page="standings">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <main id="main" class="main">
    <header class="page-header">
      <div>
        <h1>Tablas</h1>
        <p>Pulsa el encabezado de una columna para ordenar. Marca equipos con la estrella para seguirlos.</p>
      </div>
    </header>

    <div class="tabs" id="leagueTabs" role="tablist" aria-label="Ligas"></div>

    <section id="panel" role="tabpanel" tabindex="-1">
      <div class="standings-head">
        <div>
          <h2 id="leagueTitle"></h2>
          <p class="muted" id="leagueMeta"></p>
        </div>
        <div class="page-header__actions" id="leagueActions"></div>
      </div>
      <div class="toolbar" id="confFilter" hidden>
        <div class="chips" role="group" aria-label="Filtrar por conferencia"></div>
      </div>
      <div id="tableArea" aria-live="polite"></div>
    </section>
  </main>

  <noscript><p class="notice" style="margin:1rem">MultiSport Stats necesita JavaScript para cargar los datos.</p></noscript>
</body>
</html>
