<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · MultiSport Stats</title>
  <meta name="description" content="Marcadores, próximos partidos y tablas de fútbol, NBA, tenis, NHL y Fórmula 1 en un solo lugar.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="js/core/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/dashboard.css">
  <script type="module" src="js/pages/dashboard.js"></script>
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <main id="main" class="main">
    <header class="page-header">
      <div>
        <h1>Inicio</h1>
        <p id="today">Resumen deportivo del día</p>
      </div>
      <div class="page-header__actions" id="sourceNote"></div>
    </header>

    <div class="layout-2col">
      <div>
        <section class="section" id="favMatchesSection" aria-labelledby="fav-matches-title" hidden>
          <div class="section-header">
            <h2 id="fav-matches-title">Partidos de tus favoritos</h2>
          </div>
          <div id="favMatches"></div>
        </section>

        <section class="section" aria-labelledby="live-title">
          <div class="section-header">
            <h2 id="live-title"><span class="badge badge--live">En vivo</span> Ahora mismo</h2>
            <a class="section-link" href="live.html?estado=live">Ver todos</a>
          </div>
          <div id="liveList" aria-live="polite"></div>
        </section>

        <section class="section" aria-labelledby="upcoming-title">
          <div class="section-header">
            <h2 id="upcoming-title">Próximos partidos</h2>
            <a class="section-link" href="live.html?estado=upcoming">Ver calendario</a>
          </div>
          <div id="upcomingList"></div>
        </section>

        <section class="section" aria-labelledby="recent-title">
          <div class="section-header">
            <h2 id="recent-title">Resultados recientes</h2>
            <a class="section-link" href="live.html?estado=final">Ver resultados</a>
          </div>
          <div id="recentList"></div>
        </section>
      </div>

      <aside class="dash-aside" aria-label="Favoritos y clasificación">
        <section class="card card--pad" aria-labelledby="favs-title">
          <div class="section-header">
            <h2 id="favs-title">Mis favoritos</h2>
            <a class="section-link" href="profile.html#favoritos">Gestionar</a>
          </div>
          <div id="favChips" class="fav-chips"></div>
        </section>

        <section class="card" aria-labelledby="mini-title">
          <div class="card--pad" style="padding-bottom:0">
            <div class="section-header">
              <h2 id="mini-title">Clasificación</h2>
              <a class="section-link" id="miniLink" href="standings.html">Tabla completa</a>
            </div>
            <div class="chips" id="miniTabs" role="group" aria-label="Elegir liga"></div>
          </div>
          <div id="miniTable" class="table-wrap mini-table" aria-live="polite"></div>
        </section>
      </aside>
    </div>
  </main>

  <noscript><p class="notice" style="margin:1rem">MultiSport Stats necesita JavaScript para cargar los datos.</p></noscript>
</body>
</html>
