<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noticias · MultiSport Stats</title>
  <meta name="description" content="Guías y novedades de fútbol, baloncesto, tenis, hockey y Fórmula 1.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="js/core/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/news.css">
  <script type="module" src="js/pages/news.js"></script>
</head>
<body data-page="news">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <main id="main" class="main">
    <header class="page-header">
      <div>
        <h1>Noticias</h1>
        <p>Guías y novedades de tus deportes.</p>
      </div>
      <div class="page-header__actions" id="sourceNote"></div>
    </header>

    <div class="toolbar">
      <div class="chips" id="sportChips" role="group" aria-label="Filtrar por deporte"></div>
      <label class="search">
        <span class="sr-only">Buscar noticias</span>
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg>
        <input type="search" id="q" placeholder="Buscar noticias…" autocomplete="off">
      </label>
    </div>

    <p class="sr-only" id="resultCount" aria-live="polite"></p>
    <div id="newsList"></div>
  </main>

  <dialog class="dialog" id="newsDialog" aria-labelledby="dialogTitle">
    <button type="button" class="btn btn--icon btn--ghost dialog__close" data-close aria-label="Cerrar noticia">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#close"></use></svg>
    </button>
    <div id="dialogContent"></div>
  </dialog>

  <noscript><p class="notice" style="margin:1rem">MultiSport Stats necesita JavaScript para cargar los datos.</p></noscript>
</body>
</html>
